<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="AMCL 의 두 가지 핵심. 위쪽은 TF 소유권으로, map 에서 odom 은 AMCL 이 drift 보정으로 발행하고 odom 에서 base_link 는 휠 오도메트리가 연속적으로 발행한다. TF 트리에서 부모는 하나뿐이므로 AMCL 은 map 에서 base_link 를 직접 발행할 수 없고, map 에서 base_link 는 두 변환의 합성으로 자동 계산된다. 아래쪽은 파티클 필터 한 사이클로, 오도메트리로 파티클을 이동시키는 Predict, 스캔 우도로 가중치를 주는 Update, KLD 로 개수를 조절하며 재추출하는 Resample 이 반복된다.">
  <rect x="1" y="1" width="918" height="448" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="918" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="898" y="28" text-anchor="end" font-size="12" fill="#5d6b78">amcl — TF 소유권 &amp; 필터 사이클</text>

  <defs>
    <marker id="am-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3a4654"/>
    </marker>
    <marker id="am-ahd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6272a4"/>
    </marker>
  </defs>

  <!-- panel 1 -->
  <text x="36" y="80" font-size="12.5" font-weight="700" fill="#e6edf3">① TF 소유권 — AMCL 은 왜 map → odom 을 발행하나</text>

  <rect x="70" y="110" width="150" height="52" rx="9" fill="rgba(108,182,255,0.10)" stroke="#6cb6ff" stroke-width="1.5"/>
  <text x="145" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#b9dcff">map</text>

  <rect x="390" y="110" width="150" height="52" rx="9" fill="rgba(94,242,184,0.10)" stroke="#5ef2b8" stroke-width="1.5"/>
  <text x="465" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#b6f2d8">odom</text>

  <rect x="700" y="110" width="150" height="52" rx="9" fill="rgba(185,167,230,0.10)" stroke="#b9a7e6" stroke-width="1.5"/>
  <text x="775" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#d6c9f2">base_link</text>

  <g stroke="#3a4654" stroke-width="1.8" fill="none">
    <path d="M220 136 H 384" marker-end="url(#am-ah)"/>
    <path d="M540 136 H 694" marker-end="url(#am-ah)"/>
  </g>

  <text x="302" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5ef2b8">AMCL</text>
  <text x="302" y="180" text-anchor="middle" font-size="10.5" fill="#8c98a4">drift 보정 · 저주파 · 점프 가능</text>

  <text x="617" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b9a7e6">휠 오도메트리</text>
  <text x="617" y="180" text-anchor="middle" font-size="10.5" fill="#8c98a4">연속 · 고주파 · drift 누적</text>

  <rect x="70" y="196" width="780" height="44" rx="8" fill="rgba(240,163,107,0.07)" stroke="#f0a36b" stroke-width="1.1"/>
  <text x="86" y="215" font-size="11" fill="#f3c79b">TF 에서 프레임의 부모는 하나뿐 → AMCL 이 map → base_link 를 직접 발행하면 트리가 깨진다.</text>
  <text x="86" y="233" font-size="11" fill="#8c98a4">그래서 "오도메트리가 그동안 얼마나 틀렸는가"만 발행한다. map → base_link 는 두 변환의 합성으로 자동 계산.</text>

  <!-- divider -->
  <path d="M36 258 H 884" stroke="#3a4654" stroke-width="1" stroke-dasharray="3 5" fill="none"/>

  <!-- panel 2 -->
  <text x="36" y="284" font-size="12.5" font-weight="700" fill="#e6edf3">② 파티클 필터 한 사이클</text>

  <rect x="70" y="300" width="230" height="76" rx="9" fill="rgba(108,182,255,0.07)" stroke="#6cb6ff" stroke-width="1.3"/>
  <text x="86" y="324" font-size="12.5" font-weight="700" fill="#b9dcff">① Predict</text>
  <text x="86" y="345" font-size="10.5" fill="#8c98a4">오도메트리 변화만큼 파티클 이동</text>
  <text x="86" y="364" font-size="10.5" fill="#6272a4">alpha1~5 노이즈로 퍼뜨림</text>

  <rect x="345" y="300" width="230" height="76" rx="9" fill="rgba(94,242,184,0.07)" stroke="#5ef2b8" stroke-width="1.3"/>
  <text x="361" y="324" font-size="12.5" font-weight="700" fill="#b6f2d8">② Update</text>
  <text x="361" y="345" font-size="10.5" fill="#8c98a4">"여기서 이 스캔이 나올 확률"</text>
  <text x="361" y="364" font-size="10.5" fill="#6272a4">likelihood_field 로 가중치</text>

  <rect x="620" y="300" width="230" height="76" rx="9" fill="rgba(185,167,230,0.07)" stroke="#b9a7e6" stroke-width="1.3"/>
  <text x="636" y="324" font-size="12.5" font-weight="700" fill="#d6c9f2">③ Resample</text>
  <text x="636" y="345" font-size="10.5" fill="#8c98a4">가중치에 비례해 재추출</text>
  <text x="636" y="364" font-size="10.5" fill="#6272a4">KLD 로 파티클 개수 자동 조절</text>

  <g stroke="#3a4654" stroke-width="1.8" fill="none">
    <path d="M300 338 H 339" marker-end="url(#am-ah)"/>
    <path d="M575 338 H 614" marker-end="url(#am-ah)"/>
  </g>
  <g stroke="#6272a4" stroke-width="1.3" stroke-dasharray="4 4" fill="none">
    <path d="M735 376 V 396 H 185 V 380" marker-end="url(#am-ahd)"/>
  </g>

  <rect x="36" y="410" width="848" height="26" rx="6" fill="rgba(94,242,184,0.05)"/>
  <text x="52" y="427" font-size="11" fill="#8c98a4">트리거: update_min_d(예 0.25 m) 또는 update_min_a(예 0.2 rad) 이상 움직여야 1 사이클 — 정지 중에는 갱신하지 않는다.</text>
</svg>
