<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="wasab_robot_agent의 2-context 브리지 내부 구조. 왼쪽 console_ctx는 콘솔 도메인 50에 붙어 콘솔의 cmd_vel과 cmd_mode를 구독해 스레드 안전 큐에 넣기만 하고, heartbeat를 2Hz로 발행하며 재측위·도킹 이벤트 큐를 비워 발행한다. 오른쪽 robot_ctx는 로봇 로컬 도메인에 붙어 amcl_pose와 battery를 구독하고, 20Hz drain 타이머가 큐를 비워 로컬 cmd_vel로 재발행하며 0.3초 watchdog으로 명령이 끊기면 정지시킨다. 핵심 규칙은 console_ctx 콜백은 큐에 넣기만 하고 실제 발행은 robot_ctx 타이머가 자기 컨텍스트 스레드에서만 수행한다는 것이다.">
  <rect x="1" y="1" width="898" height="498" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">agent — 2-context 브리지</text>

  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3a4654"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5ef2b8"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#f0a36b"/>
    </marker>
  </defs>

  <!-- console_ctx card -->
  <rect x="34" y="66" width="250" height="360" rx="10" fill="rgba(108,182,255,0.05)" stroke="rgba(108,182,255,0.35)" stroke-width="1.2"/>
  <text x="159" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#b9dcff">console_ctx</text>
  <text x="159" y="110" text-anchor="middle" font-size="11.5" fill="#6cb6ff">콘솔 도메인 50 · executor A</text>

  <rect x="52" y="126" width="214" height="76" rx="8" fill="rgba(240,163,107,0.09)" stroke="#f0a36b" stroke-width="1.2"/>
  <text x="64" y="146" font-size="11.5" fill="#f3c79b">sub → 큐에 넣기만</text>
  <text x="64" y="166" font-size="11" fill="#8c98a4">/robot_&lt;id&gt;/cmd_vel</text>
  <text x="64" y="184" font-size="11" fill="#8c98a4">/wasab/cmd_mode</text>

  <rect x="52" y="216" width="214" height="94" rx="8" fill="rgba(94,242,184,0.10)" stroke="#5ef2b8" stroke-width="1.2"/>
  <text x="64" y="236" font-size="11.5" fill="#9fe6c8">pub ← 스냅샷 읽기</text>
  <text x="64" y="256" font-size="11" fill="#8c98a4">/robots/heartbeat · 2Hz</text>
  <text x="64" y="274" font-size="11" fill="#8c98a4">/robots/dock_event</text>
  <text x="64" y="292" font-size="11" fill="#8c98a4">/robots/reloc_event</text>

  <text x="159" y="340" text-anchor="middle" font-size="11" fill="#6272a4">콜백은 큐에 put만 —</text>
  <text x="159" y="356" text-anchor="middle" font-size="11" fill="#6272a4">여기서 로봇 도메인에</text>
  <text x="159" y="372" text-anchor="middle" font-size="11" fill="#6272a4">직접 발행하지 않는다</text>

  <!-- center: queue + snapshot -->
  <rect x="325" y="66" width="250" height="360" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(140,152,164,0.35)" stroke-width="1.2"/>
  <text x="450" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#c7d1db">thread-safe 경계</text>

  <rect x="345" y="106" width="210" height="40" rx="7" fill="rgba(94,242,184,0.06)" stroke="#3a4654" stroke-width="1"/>
  <text x="450" y="131" text-anchor="middle" font-size="12" fill="#9fe6c8">_to_robot · Queue</text>

  <rect x="345" y="156" width="210" height="40" rx="7" fill="rgba(94,242,184,0.06)" stroke="#3a4654" stroke-width="1"/>
  <text x="450" y="181" text-anchor="middle" font-size="12" fill="#9fe6c8">_reloc_events · Queue</text>

  <rect x="345" y="206" width="210" height="40" rx="7" fill="rgba(94,242,184,0.06)" stroke="#3a4654" stroke-width="1"/>
  <text x="450" y="231" text-anchor="middle" font-size="12" fill="#9fe6c8">_dock_events · Queue</text>

  <rect x="345" y="266" width="210" height="96" rx="7" fill="rgba(185,167,230,0.07)" stroke="#3a4654" stroke-width="1"/>
  <text x="450" y="286" text-anchor="middle" font-size="11.5" fill="#d6c9f2">_lock 보호 스냅샷</text>
  <text x="450" y="306" text-anchor="middle" font-size="11" fill="#8c98a4">_pose (x,y,yaw)</text>
  <text x="450" y="324" text-anchor="middle" font-size="11" fill="#8c98a4">_battery_v · _mode</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#8c98a4">_last_tag_obs</text>

  <!-- robot_ctx card -->
  <rect x="616" y="66" width="250" height="360" rx="10" fill="rgba(94,242,184,0.05)" stroke="rgba(94,242,184,0.35)" stroke-width="1.2"/>
  <text x="741" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#b6f2d8">robot_ctx</text>
  <text x="741" y="110" text-anchor="middle" font-size="11.5" fill="#5ef2b8">로컬 도메인 · executor B</text>

  <rect x="634" y="126" width="214" height="76" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="646" y="146" font-size="11.5" fill="#b9dcff">sub → 스냅샷 갱신</text>
  <text x="646" y="166" font-size="11" fill="#8c98a4">/amcl_pose · /battery</text>
  <text x="646" y="184" font-size="11" fill="#8c98a4">/tag_observation · /initialpose</text>

  <rect x="634" y="216" width="214" height="52" rx="8" fill="rgba(94,242,184,0.14)" stroke="#5ef2b8" stroke-width="1.7"/>
  <text x="741" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b6f2d8">20Hz drain 타이머</text>
  <text x="741" y="256" text-anchor="middle" font-size="11" fill="#9fe6c8">큐 비우기 + watchdog 0.3s</text>

  <rect x="634" y="282" width="214" height="76" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="646" y="302" font-size="11.5" fill="#b9dcff">pub → 로봇 도메인</text>
  <text x="646" y="322" font-size="11" fill="#8c98a4">/cmd_vel · /initialpose</text>
  <text x="646" y="340" font-size="11" fill="#8c98a4">/wasab/cmd_mode</text>

  <!-- flows: cmd path console -> queue -> robot -->
  <g stroke="#f0a36b" stroke-width="1.7" fill="none">
    <path d="M266 164 H 344" marker-end="url(#ao)"/>
  </g>
  <g stroke="#5ef2b8" stroke-width="1.7" fill="none">
    <path d="M556 126 C 600 126, 600 224, 632 232" marker-end="url(#ag)"/>
  </g>

  <!-- event path robot -> queue -> console -->
  <g stroke="#3a4654" stroke-width="1.6" fill="none">
    <path d="M634 300 C 590 300, 590 176, 556 176" marker-end="url(#af)"/>
    <path d="M344 176 C 300 176, 300 250, 266 258" marker-end="url(#af)"/>
  </g>

  <!-- bottom rule banner -->
  <rect x="34" y="446" width="832" height="40" rx="8" fill="rgba(94,242,184,0.06)" stroke="rgba(94,242,184,0.30)" stroke-width="1"/>
  <text x="450" y="471" text-anchor="middle" font-size="12" fill="#9fe6c8">규칙: console_ctx 콜백은 큐에 넣기만 · 실제 로봇 발행은 robot_ctx 20Hz 타이머가 자기 컨텍스트 스레드에서만 수행</text>
</svg>
