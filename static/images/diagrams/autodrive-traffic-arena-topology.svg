<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="순찰 링 8노드의 실제 아레나 위상. 아레나는 가로 2.10 미터 세로 1.24 미터이고 왼쪽·가운데·오른쪽 세로 복도 3개와 위쪽 가로 복도로 이루어진 세타 모양이다. 남쪽 가운데가 중앙 내벽으로 막혀 있어 S 와 tag9 사이에 직통로가 없다. 그래서 링의 B에서 tag9 구간은 중앙 내벽을 넘어 위쪽 가로 복도로 올라가 노드 M 옆 0.144 미터를 스치고 tag10-M 엣지와 0.001 미터까지 겹친 뒤 오른쪽 복도로 내려온다. 직선거리는 0.62 미터인데 실제 주행은 1.24 미터다. tag7, tag8, tag9, tag10 은 AprilTag 접근 노드이고 G, B, M 은 2026년 7월 30일에 구간을 쪼개려고 추가한 노드다.">
  <rect x="1" y="1" width="898" height="518" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">arena — 순찰 링 위상 · wasab_map12</text>

  <defs>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5d6b78"/>
    </marker>
    <marker id="td" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#f0a36b"/>
    </marker>
  </defs>

  <!-- arena outer -->
  <rect x="36" y="100" width="668" height="332" rx="6" fill="rgba(108,182,255,0.03)" stroke="rgba(108,182,255,0.30)" stroke-width="1.2"/>
  <text x="44" y="80" font-size="12" fill="#6cb6ff">아레나 2.10 × 1.24 m · 로봇 폭 0.20 m — 세로 복도 3 + 위쪽 가로 복도</text>

  <!-- inner walls -->
  <rect x="100" y="155" width="285" height="185" rx="4" fill="rgba(140,152,164,0.13)" stroke="#4a5563" stroke-width="1.1"/>
  <text x="242" y="253" text-anchor="middle" font-size="12" fill="#8c98a4">내벽</text>
  <rect x="500" y="155" width="140" height="277" rx="4" fill="rgba(140,152,164,0.13)" stroke="#4a5563" stroke-width="1.1"/>
  <text x="570" y="290" text-anchor="middle" font-size="12" fill="#8c98a4">중앙</text>
  <text x="570" y="308" text-anchor="middle" font-size="12" fill="#8c98a4">내벽</text>
  <text x="570" y="410" text-anchor="middle" font-size="11" fill="#ff8a8a">남쪽 막힘</text>

  <!-- ring edges (normal) -->
  <g fill="none" stroke="#3a4654" stroke-width="2.4">
    <path d="M54 395 L229 388" marker-end="url(#ta)"/>
    <path d="M229 388 L407 364" marker-end="url(#ta)"/>
    <path d="M407 364 L450 269" marker-end="url(#ta)"/>
    <path d="M685 409 L681 118" marker-end="url(#ta)"/>
    <path d="M681 118 L425 118" marker-end="url(#ta)"/>
    <path d="M425 118 L110 126 L59 175" marker-end="url(#ta)"/>
    <path d="M59 175 L54 395" marker-end="url(#ta)"/>
  </g>

  <!-- B -> tag9 real driven path -->
  <path d="M450 269 L455 138 L664 136 L685 409" fill="none" stroke="#f0a36b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#td)"/>

  <!-- conflict callouts -->
  <path d="M470 118 L470 136" stroke="#ff8a8a" stroke-width="1.3"/>
  <path d="M600 118 L600 136" stroke="#ff8a8a" stroke-width="1.3"/>
  <text x="470" y="151" font-size="11.5" fill="#ff8a8a">엣지 tag10-M 과 0.001 m</text>
  <path d="M432 128 L448 134" stroke="#ff8a8a" stroke-width="1.3"/>
  <text x="404" y="99" text-anchor="middle" font-size="11.5" fill="#ff8a8a">노드 M 옆 0.144 m</text>

  <!-- nodes -->
  <g stroke="#0c1117" stroke-width="1.6">
    <circle cx="54" cy="395" r="7" fill="#6cb6ff"/>
    <circle cx="229" cy="388" r="7" fill="#5ef2b8"/>
    <circle cx="407" cy="364" r="7" fill="#b9a7e6"/>
    <circle cx="450" cy="269" r="7" fill="#5ef2b8"/>
    <circle cx="685" cy="409" r="7" fill="#6cb6ff"/>
    <circle cx="681" cy="118" r="7" fill="#6cb6ff"/>
    <circle cx="425" cy="118" r="7" fill="#5ef2b8"/>
    <circle cx="59" cy="175" r="7" fill="#6cb6ff"/>
  </g>
  <g font-size="13" font-weight="600">
    <text x="54" y="418" text-anchor="middle" fill="#b9dcff">tag8</text>
    <text x="229" y="411" text-anchor="middle" fill="#b6f2d8">G</text>
    <text x="398" y="384" text-anchor="end" fill="#d6c9f2">S</text>
    <text x="464" y="266" fill="#b6f2d8">B</text>
    <text x="685" y="432" text-anchor="middle" fill="#b9dcff">tag9</text>
    <text x="672" y="103" text-anchor="end" fill="#b9dcff">tag10</text>
    <text x="425" y="141" text-anchor="middle" fill="#b6f2d8">M</text>
    <text x="72" y="167" fill="#b9dcff">tag7</text>
  </g>

  <!-- tight-clearance marks -->
  <text x="140" y="382" font-size="11" fill="#8c98a4">0.12 m</text>
  <text x="240" y="146" font-size="11" fill="#8c98a4">0.14 m · 부족 44 %</text>

  <!-- legend -->
  <rect x="718" y="100" width="164" height="332" rx="8" fill="rgba(255,255,255,0.02)" stroke="#26314a" stroke-width="1"/>
  <text x="734" y="124" font-size="12" fill="#5d6b78">legend</text>
  <circle cx="740" cy="148" r="6" fill="#6cb6ff"/>
  <text x="754" y="152" font-size="11.5" fill="#8c98a4">AprilTag 접근 노드</text>
  <circle cx="740" cy="174" r="6" fill="#5ef2b8"/>
  <text x="754" y="178" font-size="11.5" fill="#8c98a4">07-30 추가 노드</text>
  <circle cx="740" cy="200" r="6" fill="#b9a7e6"/>
  <text x="754" y="204" font-size="11.5" fill="#8c98a4">기존 경유점</text>
  <path d="M732 226 L756 226" stroke="#3a4654" stroke-width="2.4"/>
  <text x="764" y="230" font-size="11.5" fill="#8c98a4">링 엣지</text>
  <path d="M732 252 L756 252" stroke="#f0a36b" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="764" y="256" font-size="11.5" fill="#f0a36b">B→tag9 실주행</text>
  <rect x="732" y="272" width="24" height="12" rx="2" fill="rgba(140,152,164,0.13)" stroke="#4a5563"/>
  <text x="764" y="282" font-size="11.5" fill="#8c98a4">내벽</text>
  <text x="734" y="316" font-size="11.5" fill="#6272a4">필요 벽여유</text>
  <text x="734" y="334" font-size="11.5" fill="#6272a4">0.16 m</text>
  <text x="734" y="356" font-size="11.5" fill="#ff8a8a">실측 0.12~0.18 m</text>
  <text x="734" y="374" font-size="11.5" fill="#ff8a8a">8구간 중 6구간 부족</text>
  <text x="734" y="404" font-size="11.5" fill="#6272a4">판정 반경</text>
  <text x="734" y="422" font-size="11.5" fill="#6272a4">NODE_TOL 0.10 m</text>

  <!-- captions -->
  <text x="36" y="462" font-size="12" fill="#8c98a4">남쪽 가운데가 막혀 있어 <tspan fill="#d6c9f2">S</tspan> 와 <tspan fill="#b9dcff">tag9</tspan> 사이에 직통로가 없다 — 링의 <tspan fill="#f0a36b">B→tag9</tspan> 는 중앙 내벽을 넘어 돌아간다.</text>
  <text x="36" y="484" font-size="12" fill="#8c98a4">직선거리 0.62 m · 실제 주행 1.24 m. 이 한 구간이 하루치 사고의 절반을 만들었다.</text>
  <text x="36" y="506" font-size="12" fill="#6272a4">링 그래프상 노드를 공유하지 않는데 실제 차선은 겹친다 → <tspan fill="#ff8a8a">실측으로 증명된 상호배제 규칙 2개</tspan>의 근거.</text>
</svg>
