<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="The four stage pipeline that turns a 2D lidar scan into a V groove pose: convert the scan to a point cloud, cut it into clusters where the point spacing jumps, split each cluster into straight segments with split-and-merge, select the segment pair whose included angle is near 120 degrees and whose endpoints meet, then take the intersection of the two fitted lines as the apex and the bisector as the heading, published as a PoseStamped.">
  <rect x="1" y="1" width="918" height="298" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="918" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="898" y="28" text-anchor="end" font-size="12" fill="#5d6b78">pipeline — scan to pose</text>

  <text x="40" y="76" font-size="11" fill="#6272a4">/scan (LaserScan, 720 beams · 10 Hz)</text>

  <!-- 4 stages -->
  <rect x="40" y="90" width="196" height="96" rx="10" fill="rgba(108,182,255,0.07)" stroke="#6cb6ff" stroke-width="1.3"/>
  <text x="60" y="116" font-size="12.5" font-weight="700" fill="#b9dcff">1 · Cluster</text>
  <text x="60" y="138" font-size="11" fill="#8c98a4">split where the gap</text>
  <text x="60" y="155" font-size="11" fill="#8c98a4">between points jumps</text>
  <text x="60" y="174" font-size="10.5" fill="#6272a4">threshold scales with range</text>

  <rect x="256" y="90" width="196" height="96" rx="10" fill="rgba(108,182,255,0.07)" stroke="#6cb6ff" stroke-width="1.3"/>
  <text x="276" y="116" font-size="12.5" font-weight="700" fill="#b9dcff">2 · Split to lines</text>
  <text x="276" y="138" font-size="11" fill="#8c98a4">split-and-merge</text>
  <text x="276" y="155" font-size="11" fill="#8c98a4">residual over 6 mm →</text>
  <text x="276" y="174" font-size="10.5" fill="#6272a4">cut at that point</text>

  <rect x="472" y="90" width="196" height="96" rx="10" fill="rgba(185,167,230,0.08)" stroke="#b9a7e6" stroke-width="1.3"/>
  <text x="492" y="116" font-size="12.5" font-weight="700" fill="#d6c9f2">3 · Pair up</text>
  <text x="492" y="138" font-size="11" fill="#8c98a4">included angle 120° ± 20°</text>
  <text x="492" y="155" font-size="11" fill="#8c98a4">endpoints within 5 cm</text>
  <text x="492" y="174" font-size="10.5" fill="#6272a4">arm length 8–30 cm</text>

  <rect x="688" y="90" width="192" height="96" rx="10" fill="rgba(94,242,184,0.12)" stroke="#5ef2b8" stroke-width="1.8"/>
  <text x="708" y="116" font-size="12.5" font-weight="700" fill="#b6f2d8">4 · Solve pose</text>
  <text x="708" y="138" font-size="11" fill="#5ef2b8">intersection of the lines</text>
  <text x="708" y="155" font-size="11" fill="#8c98a4">+ bisector + 180°</text>
  <text x="708" y="174" font-size="10.5" fill="#6272a4">→ to base via TF</text>

  <!-- arrows -->
  <g stroke="#3a4654" stroke-width="1.6" fill="none">
    <path d="M236 138 H 252"/>
    <path d="M452 138 H 468"/>
    <path d="M668 138 H 684"/>
  </g>
  <g fill="#3a4654">
    <path d="M252 138 l -7 -4 v 8 z"/>
    <path d="M468 138 l -7 -4 v 8 z"/>
    <path d="M684 138 l -7 -4 v 8 z"/>
  </g>

  <!-- output -->
  <rect x="40" y="206" width="840" height="30" rx="7" fill="rgba(94,242,184,0.07)" stroke="rgba(94,242,184,0.22)"/>
  <text x="56" y="226" font-size="11.5" fill="#5ef2b8">PoseStamped → /wasab/vgroove_pose</text>
  <text x="330" y="226" font-size="11.5" fill="#8c98a4">same message the camera detector published — zero control-code changes</text>

  <rect x="40" y="248" width="840" height="30" rx="7" fill="rgba(240,163,107,0.06)"/>
  <text x="56" y="268" font-size="11" fill="#8c98a4">The apex is not a point sampled on the corner — it is where the two fitted lines cross, so it survives jittering endpoints.</text>
</svg>
