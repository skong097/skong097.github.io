<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="통행 중재기 구조. 로봇 44, 50, 87 에는 아무것도 새로 배포하지 않고 기존 agent_node 가 2Hz BEST_EFFORT QoS 로 발행하는 heartbeat 만 쓴다. PC 도메인 50 위에 로봇별 patrol_node 세 개와 중재 노드 wasab_traffic 이 올라가고, patrol_node 가 다음 구간으로 출발하기 전에 /traffic/request 로 승인을 요청하면 wasab_traffic 이 5Hz tick 마다 모아서 일괄 판정해 /traffic/grant 로 GRANTED 또는 QUEUED 를 돌려준다. 중재 노드는 순수 판정 로직 traffic_rules.py 와 ROS 배선만 담당하는 traffic_node.py 로 분리되어 있다. 웹앱 백엔드도 /traffic/grant 를 구독해 실제로 기다린 경우만 종합 이벤트로 남긴다.">
  <rect x="1" y="1" width="898" height="478" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">arch — Traffic Arbiter</text>

  <defs>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3a4654"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5ef2b8"/>
    </marker>
  </defs>

  <!-- PC container -->
  <rect x="40" y="66" width="820" height="200" rx="10" fill="rgba(108,182,255,0.05)" stroke="rgba(108,182,255,0.35)" stroke-width="1.2"/>
  <text x="58" y="88" font-size="12" fill="#6cb6ff">PC 한 대 — 도메인 50 · 중재는 전부 여기서 돈다</text>

  <rect x="64" y="100" width="200" height="86" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="164" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#b9dcff">patrol_node ×3</text>
  <text x="164" y="147" text-anchor="middle" font-size="11.5" fill="#8c98a4">순찰 상태기계</text>
  <text x="164" y="166" text-anchor="middle" font-size="11.5" fill="#8c98a4">출발 게이트 · 요청 재전송</text>

  <rect x="330" y="96" width="250" height="140" rx="9" fill="rgba(94,242,184,0.10)" stroke="#5ef2b8" stroke-width="1.7"/>
  <text x="455" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#b6f2d8">wasab_traffic</text>
  <text x="455" y="141" text-anchor="middle" font-size="11.5" fill="#9fe6c8">tick 5 Hz — 모아서 일괄 판정</text>
  <rect x="346" y="154" width="218" height="30" rx="6" fill="rgba(94,242,184,0.07)" stroke="rgba(94,242,184,0.35)"/>
  <text x="455" y="174" text-anchor="middle" font-size="11.5" fill="#b6f2d8">traffic_rules.py — 순수 판정 (ROS 무의존)</text>
  <rect x="346" y="190" width="218" height="30" rx="6" fill="rgba(94,242,184,0.07)" stroke="rgba(94,242,184,0.35)"/>
  <text x="455" y="210" text-anchor="middle" font-size="11.5" fill="#b6f2d8">traffic_node.py — ROS 배선만</text>

  <rect x="646" y="100" width="190" height="86" rx="8" fill="rgba(185,167,230,0.08)" stroke="#b9a7e6" stroke-width="1.2"/>
  <text x="741" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#d6c9f2">웹앱 백엔드</text>
  <text x="741" y="147" text-anchor="middle" font-size="11.5" fill="#8c98a4">종합 이벤트</text>
  <text x="741" y="166" text-anchor="middle" font-size="11.5" fill="#8c98a4">대기 시작 / 대기 해제</text>

  <!-- request / grant -->
  <g fill="none" stroke="#3a4654" stroke-width="1.7">
    <path d="M264 138 L330 138" marker-end="url(#aa)"/>
    <path d="M330 176 L264 176" marker-end="url(#aa)"/>
    <path d="M580 150 L646 150" marker-end="url(#aa)"/>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="297" y="113" fill="#f0a36b">/traffic/</text>
    <text x="297" y="126" fill="#f0a36b">request</text>
    <text x="297" y="196" fill="#5ef2b8">/traffic/</text>
    <text x="297" y="209" fill="#5ef2b8">grant</text>
    <text x="613" y="172" fill="#8c98a4">/traffic/</text>
    <text x="613" y="185" fill="#8c98a4">grant</text>
  </g>

  <!-- heartbeat -->
  <path d="M455 356 L455 236" fill="none" stroke="#5ef2b8" stroke-width="1.9" marker-end="url(#ag)"/>
  <text x="472" y="290" font-size="12" fill="#5ef2b8">/robots/heartbeat</text>
  <text x="472" y="309" font-size="11.5" fill="#9fe6c8">2 Hz · <tspan font-weight="700">BEST_EFFORT</tspan></text>
  <text x="443" y="290" text-anchor="end" font-size="11.5" fill="#8c98a4">pose · battery</text>
  <text x="443" y="309" text-anchor="end" font-size="11.5" fill="#8c98a4">robot_id</text>

  <!-- robots -->
  <rect x="40" y="330" width="820" height="104" rx="10" fill="rgba(94,242,184,0.04)" stroke="rgba(94,242,184,0.30)" stroke-width="1.2"/>
  <text x="58" y="352" font-size="12" fill="#5ef2b8">로봇 44 · 50 · 87 — 배포 없음, 재기동 없음</text>
  <rect x="330" y="360" width="250" height="54" rx="8" fill="rgba(240,163,107,0.09)" stroke="#f0a36b" stroke-width="1.3"/>
  <text x="455" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#f3c79b">agent_node</text>
  <text x="455" y="402" text-anchor="middle" font-size="11.5" fill="#8c98a4">기존 heartbeat 를 그대로 쓴다</text>
  <text x="608" y="382" font-size="11.5" fill="#6272a4">로봇 쪽 코드는</text>
  <text x="608" y="401" font-size="11.5" fill="#6272a4">한 줄도 바꾸지 않았다</text>
  <text x="302" y="382" text-anchor="end" font-size="11.5" fill="#6272a4">Nav2 · AMCL</text>
  <text x="302" y="401" text-anchor="end" font-size="11.5" fill="#6272a4">그대로</text>

  <text x="40" y="462" font-size="12" fill="#8c98a4">중재기가 RELIABLE 로 구독하면 BEST_EFFORT 발행을 <tspan fill="#ff8a8a">한 건도 못 받는다</tspan> — 점유표가 비어 아무나 승인한다. 96 tests green 이어도 안 잡힌다.</text>
</svg>
