<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="홉 기반 점유 모델의 두 가지 동작 비교. 위쪽은 출발 노드를 승인 즉시 놓는 방식이다. 로봇50 이 tag9 에서 tag10 으로 출발하면서 tag9 을 즉시 해제하자 0.2 초 뒤 로봇44 가 B 에서 tag9 으로 승인받아 간격 0.269 미터까지 붙었고, 앞차가 좌우 벽과 후방 로봇에 둘러싸여 284 초 동안 한 발도 못 움직였다. 아래쪽은 최종 방식이다. 주행 중인 로봇은 출발 노드와 도착 노드와 그 엣지를 도착할 때까지 함께 쥔다. 로봇44 의 요청이 필요로 하는 tag9 이 로봇50 의 점유와 겹치므로 QUEUED 로 대기하고, 그 결과 두 로봇 사이에는 항상 한 구간이 통째로 비어 있다. 승인을 쥔 로봇의 점유는 좌표를 전혀 보지 않고 홉으로만 계산한다.">
  <rect x="1" y="1" width="898" height="518" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">occupancy — 홉으로 센다</text>

  <!-- ================= row A : immediate release ================= -->
  <rect x="36" y="64" width="828" height="196" rx="10" fill="rgba(255,138,138,0.04)" stroke="rgba(255,138,138,0.35)" stroke-width="1.2"/>
  <text x="54" y="88" font-size="13" font-weight="600" fill="#ff8a8a">① 되돌린 방식 — 출발 노드를 승인 즉시 놓는다</text>

  <text x="170" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">B</text>
  <text x="420" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">tag9</text>
  <text x="670" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">tag10</text>
  <text x="420" y="116" text-anchor="middle" font-size="11" fill="#ff8a8a">즉시 해제</text>

  <path d="M170 152 L670 152" fill="none" stroke="#3a4654" stroke-width="2.5"/>
  <circle cx="170" cy="152" r="8" fill="#6cb6ff" stroke="#0c1117" stroke-width="1.6"/>
  <circle cx="420" cy="152" r="8" fill="#0c1117" stroke="#ff8a8a" stroke-width="2"/>
  <circle cx="670" cy="152" r="8" fill="#6cb6ff" stroke="#0c1117" stroke-width="1.6"/>

  <rect x="410" y="168" width="62" height="26" rx="6" fill="rgba(108,182,255,0.14)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="441" y="186" text-anchor="middle" font-size="12" fill="#b9dcff">44</text>
  <rect x="490" y="168" width="62" height="26" rx="6" fill="rgba(240,163,107,0.14)" stroke="#f0a36b" stroke-width="1.2"/>
  <text x="521" y="186" text-anchor="middle" font-size="12" fill="#f3c79b">50</text>
  <path d="M474 181 L486 181" stroke="#ff8a8a" stroke-width="1.4"/>
  <text x="562" y="186" font-size="11.5" fill="#ff8a8a">간격 0.269 m — 벽여유 0.12 m 복도에서</text>

  <rect x="176" y="212" width="250" height="14" rx="4" fill="rgba(108,182,255,0.22)" stroke="#6cb6ff" stroke-width="1"/>
  <text x="182" y="240" font-size="11.5" fill="#6cb6ff">44 점유 {B, tag9, 엣지}</text>
  <rect x="434" y="212" width="230" height="14" rx="4" fill="rgba(240,163,107,0.20)" stroke="#f0a36b" stroke-width="1"/>
  <text x="664" y="240" text-anchor="end" font-size="11.5" fill="#f0a36b">50 점유 {tag10, 엣지} — tag9 은 놓았다</text>

  <text x="854" y="240" text-anchor="end" font-size="11.5" fill="#ff8a8a">284 초간 이동 0.000 m</text>

  <!-- ================= row B : hold until arrival ================= -->
  <rect x="36" y="276" width="828" height="196" rx="10" fill="rgba(94,242,184,0.04)" stroke="rgba(94,242,184,0.35)" stroke-width="1.2"/>
  <text x="54" y="300" font-size="13" font-weight="600" fill="#5ef2b8">② 최종 — 출발 노드를 도착할 때까지 쥔다</text>

  <path d="M206 330 L206 322 L404 322 L404 330" fill="none" stroke="#5ef2b8" stroke-width="1.3"/>
  <text x="305" y="316" text-anchor="middle" font-size="11.5" fill="#5ef2b8">항상 통째로 비어 있는 한 구간</text>

  <text x="170" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">B</text>
  <text x="420" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#b6f2d8">tag9</text>
  <text x="670" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#b6f2d8">tag10</text>

  <path d="M170 366 L670 366" fill="none" stroke="#3a4654" stroke-width="2.5"/>
  <circle cx="170" cy="366" r="8" fill="#6cb6ff" stroke="#0c1117" stroke-width="1.6"/>
  <circle cx="420" cy="366" r="8" fill="#5ef2b8" stroke="#0c1117" stroke-width="1.6"/>
  <circle cx="670" cy="366" r="8" fill="#5ef2b8" stroke="#0c1117" stroke-width="1.6"/>

  <rect x="139" y="382" width="62" height="26" rx="6" fill="rgba(108,182,255,0.14)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="170" y="400" text-anchor="middle" font-size="12" fill="#b9dcff">44</text>
  <text x="212" y="400" font-size="11.5" fill="#8c98a4">B 에서 <tspan fill="#febc2e">QUEUED</tspan> — 사유 &quot;moving&quot;</text>
  <rect x="530" y="382" width="62" height="26" rx="6" fill="rgba(240,163,107,0.14)" stroke="#f0a36b" stroke-width="1.2"/>
  <text x="561" y="400" text-anchor="middle" font-size="12" fill="#f3c79b">50</text>

  <rect x="412" y="426" width="260" height="14" rx="4" fill="rgba(94,242,184,0.20)" stroke="#5ef2b8" stroke-width="1"/>
  <text x="412" y="454" font-size="11.5" fill="#5ef2b8">50 점유 {tag9, tag10, 엣지} — 좌표는 보지 않는다</text>
  <text x="854" y="454" text-anchor="end" font-size="11.5" fill="#5ef2b8">추돌 0 · 대기 0</text>

  <text x="36" y="498" font-size="12" fill="#8c98a4">need = { 도착 노드, 요청 엣지 } · busy = 나를 뺀 전원의 점유 · <tspan fill="#ff8a8a">clash = need ∩ busy</tspan> 가 비어야 GRANTED. 위 경우 clash = {tag9}.</text>
</svg>
