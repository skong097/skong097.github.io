<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="처음 설계한 Tool Use 루프 — 요청에서 LLM 판단, 도구 선택, 도구 호출, 결과 관찰을 거쳐 다시 LLM 판단으로 돌아가는 반복 구조">
  <rect x="1" y="1" width="758" height="228" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="758" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>
  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="738" y="28" text-anchor="end" font-size="12" fill="#5d6b78">tool use loop — 처음 설계</text>

  <g stroke="#3a4654" stroke-width="1.6" fill="none">
    <path d="M172 108 H 186"/>
    <path d="M306 108 H 320"/>
    <path d="M440 108 H 454"/>
    <path d="M574 108 H 588"/>
  </g>
  <path d="M194 108 L 182 102 L 182 114 Z" fill="#3a4654"/>
  <path d="M328 108 L 316 102 L 316 114 Z" fill="#3a4654"/>
  <path d="M462 108 L 450 102 L 450 114 Z" fill="#3a4654"/>
  <path d="M596 108 L 584 102 L 584 114 Z" fill="#3a4654"/>

  <rect x="56" y="86" width="112" height="44" rx="8" fill="rgba(108,182,255,0.06)" stroke="#3a4654" stroke-width="1.6"/>
  <text x="112" y="113" text-anchor="middle" font-size="13" fill="#6cb6ff">요청</text>
  <rect x="190" y="86" width="112" height="44" rx="8" fill="rgba(240,163,107,0.09)" stroke="#3a4654" stroke-width="1.6"/>
  <text x="246" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#f0a36b">LLM 판단</text>
  <rect x="324" y="86" width="112" height="44" rx="8" fill="rgba(108,182,255,0.06)" stroke="#3a4654" stroke-width="1.6"/>
  <text x="380" y="113" text-anchor="middle" font-size="13" fill="#6cb6ff">도구 선택</text>
  <rect x="458" y="86" width="112" height="44" rx="8" fill="rgba(108,182,255,0.06)" stroke="#3a4654" stroke-width="1.6"/>
  <text x="514" y="113" text-anchor="middle" font-size="13" fill="#6cb6ff">도구 호출</text>
  <rect x="592" y="86" width="112" height="44" rx="8" fill="rgba(94,242,184,0.06)" stroke="#3a4654" stroke-width="1.6"/>
  <text x="648" y="113" text-anchor="middle" font-size="13" fill="#5ef2b8">결과 관찰</text>

  <!-- loop back to LLM 판단 -->
  <g stroke="#f0a36b" stroke-width="1.4" fill="none">
    <path d="M648 130 V 172 H 246 V 142"/>
  </g>
  <path d="M246 130 L 240 144 L 252 144 Z" fill="#f0a36b"/>
  <text x="447" y="192" text-anchor="middle" font-size="12" fill="#f0a36b">반복</text>
</svg>
