<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="2D 라이다 스캔에서 V홈 자세를 뽑아내는 네 단계 파이프라인. 스캔을 점 구름으로 바꾸고, 점 간격이 벌어지는 곳에서 클러스터로 끊고, 각 덩어리를 split-and-merge 로 직선 조각으로 펴고, 끼인각 120도 안팎이면서 끝점이 만나는 선분 쌍을 골라, 두 직선의 교점을 꼭짓점으로 두 팔의 이등분선을 방향으로 삼아 PoseStamped 를 발행한다.">
  <rect x="1" y="1" width="918" height="298" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="918" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="898" y="28" text-anchor="end" font-size="12" fill="#5d6b78">pipeline — scan to pose</text>

  <text x="40" y="76" font-size="11" fill="#6272a4">/scan (LaserScan, 720빔 · 10 Hz)</text>

  <!-- 4 stages -->
  <rect x="40" y="90" width="196" height="96" rx="10" fill="rgba(108,182,255,0.07)" stroke="#6cb6ff" stroke-width="1.3"/>
  <text x="60" y="116" font-size="12.5" font-weight="700" fill="#b9dcff">1 · 클러스터링</text>
  <text x="60" y="138" font-size="11" fill="#8c98a4">점 간격이 갑자기</text>
  <text x="60" y="155" font-size="11" fill="#8c98a4">벌어지면 끊는다</text>
  <text x="60" y="174" font-size="10.5" fill="#6272a4">임계 = 거리 비례</text>

  <rect x="256" y="90" width="196" height="96" rx="10" fill="rgba(108,182,255,0.07)" stroke="#6cb6ff" stroke-width="1.3"/>
  <text x="276" y="116" font-size="12.5" font-weight="700" fill="#b9dcff">2 · 직선 분해</text>
  <text x="276" y="138" font-size="11" fill="#8c98a4">split-and-merge</text>
  <text x="276" y="155" font-size="11" fill="#8c98a4">잔차 6 mm 초과 →</text>
  <text x="276" y="174" font-size="10.5" fill="#6272a4">그 점에서 쪼갠다</text>

  <rect x="472" y="90" width="196" height="96" rx="10" fill="rgba(185,167,230,0.08)" stroke="#b9a7e6" stroke-width="1.3"/>
  <text x="492" y="116" font-size="12.5" font-weight="700" fill="#d6c9f2">3 · 쌍 찾기</text>
  <text x="492" y="138" font-size="11" fill="#8c98a4">끼인각 120° ± 20°</text>
  <text x="492" y="155" font-size="11" fill="#8c98a4">끝점이 5 cm 이내</text>
  <text x="492" y="174" font-size="10.5" fill="#6272a4">팔 길이 8~30 cm</text>

  <rect x="688" y="90" width="192" height="96" rx="10" fill="rgba(94,242,184,0.12)" stroke="#5ef2b8" stroke-width="1.8"/>
  <text x="708" y="116" font-size="12.5" font-weight="700" fill="#b6f2d8">4 · 자세 산출</text>
  <text x="708" y="138" font-size="11" fill="#5ef2b8">두 직선의 교점</text>
  <text x="708" y="155" font-size="11" fill="#8c98a4">+ 이등분선 + 180°</text>
  <text x="708" y="174" font-size="10.5" fill="#6272a4">→ TF 로 base 변환</text>

  <!-- arrows -->
  <g stroke="#3a4654" stroke-width="1.6" fill="none">
    <path d="M236 138 H 252"/>
    <path d="M452 138 H 468"/>
    <path d="M668 138 H 684"/>
  </g>
  <g fill="#3a4654">
    <path d="M252 138 l -7 -4 v 8 z"/>
    <path d="M468 138 l -7 -4 v 8 z"/>
    <path d="M684 138 l -7 -4 v 8 z"/>
  </g>

  <!-- output -->
  <rect x="40" y="206" width="840" height="30" rx="7" fill="rgba(94,242,184,0.07)" stroke="rgba(94,242,184,0.22)"/>
  <text x="56" y="226" font-size="11.5" fill="#5ef2b8">PoseStamped → /wasab/vgroove_pose</text>
  <text x="330" y="226" font-size="11.5" fill="#8c98a4">기존 정밀 주차 노드가 카메라에서 받던 것과 같은 메시지 — 제어 코드 수정 0줄</text>

  <rect x="40" y="248" width="840" height="30" rx="7" fill="rgba(240,163,107,0.06)"/>
  <text x="56" y="268" font-size="11" fill="#8c98a4">꼭짓점을 "모서리에 찍힌 점"으로 잡지 않는다 — 두 변을 각각 피팅해 그 교점을 쓴다. 그래야 끝점이 흔들려도 버틴다.</text>
</svg>
