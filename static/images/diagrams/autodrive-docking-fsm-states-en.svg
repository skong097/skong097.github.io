<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="The eight states of the docking FSM and the control ownership split. From IDLE it runs through NAV_TO_APPROACH, SEARCH_TAG, TAG_SERVO_ALIGN and SETTLE to DONE. During NAV_TO_APPROACH and NAV_CANCELING, Nav2 owns cmd_vel so the precision parking node is forbidden from publishing; during TAG_SERVO_ALIGN and SETTLE the precision parking node owns control via pose regulation. A timeout or a tolerance miss drops to FAILED, and ESTOP is not a transition but a latch set from outside the pure module.">
  <rect x="1" y="1" width="898" height="388" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">state_machine.py — docking FSM</text>

  <!-- ownership bands -->
  <rect x="150" y="102" width="170" height="142" rx="9" fill="rgba(108,182,255,0.05)" stroke="#6cb6ff" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="235" y="94" text-anchor="middle" font-size="10.5" fill="#6cb6ff">Nav2 owns cmd_vel · _NO_PUBLISH</text>

  <rect x="470" y="102" width="280" height="70" rx="9" fill="rgba(94,242,184,0.05)" stroke="#5ef2b8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="610" y="94" text-anchor="middle" font-size="10.5" fill="#5ef2b8">parking node owns it · pose regulation</text>

  <!-- row 1 -->
  <rect x="50" y="118" width="90" height="36" rx="7" fill="rgba(140,152,164,0.10)" stroke="#8c98a4" stroke-width="1.1"/>
  <text x="95" y="141" text-anchor="middle" font-size="11.5" fill="#c3ccd6">IDLE</text>

  <rect x="160" y="118" width="150" height="36" rx="7" fill="rgba(108,182,255,0.12)" stroke="#6cb6ff" stroke-width="1.1"/>
  <text x="235" y="141" text-anchor="middle" font-size="11.5" fill="#b9dcff">NAV_TO_APPROACH</text>

  <rect x="340" y="118" width="120" height="36" rx="7" fill="rgba(185,167,230,0.12)" stroke="#b9a7e6" stroke-width="1.1"/>
  <text x="400" y="141" text-anchor="middle" font-size="11.5" fill="#d3c6f0">SEARCH_TAG</text>

  <rect x="480" y="118" width="150" height="36" rx="7" fill="rgba(94,242,184,0.12)" stroke="#5ef2b8" stroke-width="1.1"/>
  <text x="555" y="141" text-anchor="middle" font-size="11.5" fill="#b6f2d8">TAG_SERVO_ALIGN</text>

  <rect x="650" y="118" width="90" height="36" rx="7" fill="rgba(94,242,184,0.12)" stroke="#5ef2b8" stroke-width="1.1"/>
  <text x="695" y="141" text-anchor="middle" font-size="11.5" fill="#b6f2d8">SETTLE</text>

  <rect x="770" y="118" width="90" height="36" rx="7" fill="rgba(40,200,64,0.12)" stroke="#28c840" stroke-width="1.1"/>
  <text x="815" y="141" text-anchor="middle" font-size="11.5" fill="#8ce89c">DONE</text>

  <path d="M140 136 L154 136" fill="none" stroke="#3a4654" stroke-width="1.6"/>
  <polygon points="160,136 152,132 152,140" fill="#3a4654"/>
  <path d="M310 136 L334 136" fill="none" stroke="#3a4654" stroke-width="1.6"/>
  <polygon points="340,136 332,132 332,140" fill="#3a4654"/>
  <path d="M460 136 L474 136" fill="none" stroke="#3a4654" stroke-width="1.6"/>
  <polygon points="480,136 472,132 472,140" fill="#3a4654"/>
  <path d="M630 136 L644 136" fill="none" stroke="#3a4654" stroke-width="1.6"/>
  <polygon points="650,136 642,132 642,140" fill="#3a4654"/>
  <path d="M740 136 L764 136" fill="none" stroke="#3a4654" stroke-width="1.6"/>
  <polygon points="770,136 762,132 762,140" fill="#3a4654"/>

  <!-- row 2 -->
  <rect x="160" y="200" width="150" height="36" rx="7" fill="rgba(108,182,255,0.12)" stroke="#6cb6ff" stroke-width="1.1"/>
  <text x="235" y="223" text-anchor="middle" font-size="11.5" fill="#b9dcff">NAV_CANCELING</text>

  <rect x="770" y="200" width="90" height="36" rx="7" fill="rgba(255,138,138,0.12)" stroke="#ff8a8a" stroke-width="1.1"/>
  <text x="815" y="223" text-anchor="middle" font-size="11.5" fill="#ffb3b3">FAILED</text>

  <path d="M200 154 L200 194" fill="none" stroke="#3a4654" stroke-width="1.6"/>
  <polygon points="200,200 196,192 204,192" fill="#3a4654"/>
  <text x="212" y="182" font-size="10" fill="#8c98a4">cancel goal</text>

  <path d="M290 200 L290 178 L400 178 L400 160" fill="none" stroke="#3a4654" stroke-width="1.6"/>
  <polygon points="400,154 396,162 404,162" fill="#3a4654"/>

  <path d="M555 154 L555 218 L764 218" fill="none" stroke="#ff8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="770,218 762,214 762,222" fill="#ff8a8a"/>
  <text x="600" y="212" font-size="10" fill="#ff8a8a">timeout · tolerance miss</text>

  <!-- estop overlay -->
  <rect x="50" y="268" width="250" height="46" rx="9" fill="rgba(255,138,138,0.05)" stroke="#ff8a8a" stroke-width="1.2"/>
  <text x="66" y="288" font-size="12.5" font-weight="600" fill="#ff8a8a">ESTOP</text>
  <text x="66" y="306" font-size="10.5" fill="#8c98a4">set from outside the pure module</text>

  <text x="320" y="288" font-size="11" fill="#8c98a4">It wins in any state or mission. It does not stop the robot by transition —</text>
  <text x="320" y="306" font-size="11" fill="#8c98a4">base cuts it with a <tspan fill="#ff8a8a">latch that ignores cmd_vel</tspan> right before the motors.</text>

  <text x="50" y="352" font-size="11.5" fill="#8c98a4">TAG_SERVO_ALIGN is not plain P control but <tspan fill="#5ef2b8">pose regulation (ρ, α, β)</tspan>: a diff-drive cannot cancel a lateral</text>
  <text x="50" y="370" font-size="11.5" fill="#8c98a4">offset by turning in place, so the robot <tspan fill="#5ef2b8">arcs onto the tag normal</tspan> — ey → 0, eyaw → 0, ex → 0.</text>
</svg>
