<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="A six-axis comparison of the Planner Server and the Controller Server. The planner answers which way to go, sees the whole map, runs at 1 Hz, emits a nav_msgs/Path and cares about completeness and optimality. The controller answers what velocity to command right now, sees only a few metres, runs at 20 to 50 Hz, emits a geometry_msgs/Twist and cares about dynamic constraints and immediate avoidance. They are split because a global search cannot run at 20 Hz while collision avoidance must.">
  <rect x="1" y="1" width="898" height="498" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">nav2 — planner vs controller</text>

  <rect x="190" y="68" width="330" height="52" rx="9" fill="rgba(108,182,255,0.10)" stroke="#6cb6ff" stroke-width="1.4"/>
  <text x="355" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#b9dcff">Planner Server</text>
  <text x="355" y="109" text-anchor="middle" font-size="10.5" fill="#8c98a4">global · slow · wide</text>

  <rect x="534" y="68" width="330" height="52" rx="9" fill="rgba(94,242,184,0.10)" stroke="#5ef2b8" stroke-width="1.4"/>
  <text x="699" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#b6f2d8">Controller Server</text>
  <text x="699" y="109" text-anchor="middle" font-size="10.5" fill="#8c98a4">local · fast · narrow</text>

  <rect x="36" y="132" width="828" height="38" rx="6" fill="rgba(255,255,255,0.025)"/>
  <text x="48" y="156" font-size="11" fill="#5d6b78">question</text>
  <text x="204" y="156" font-size="12" fill="#c9d1d9">"which way do I go?"</text>
  <text x="548" y="156" font-size="12" fill="#c9d1d9">"what velocity right now?"</text>

  <rect x="36" y="178" width="828" height="38" rx="6" fill="rgba(255,255,255,0.01)"/>
  <text x="48" y="202" font-size="11" fill="#5d6b78">horizon</text>
  <text x="204" y="202" font-size="12" fill="#c9d1d9">the whole map (global costmap)</text>
  <text x="548" y="202" font-size="12" fill="#c9d1d9">a few metres (local costmap)</text>

  <rect x="36" y="224" width="828" height="38" rx="6" fill="rgba(255,255,255,0.025)"/>
  <text x="48" y="248" font-size="11" fill="#5d6b78">rate</text>
  <text x="204" y="248" font-size="12" font-weight="700" fill="#6cb6ff">1 Hz</text>
  <text x="252" y="248" font-size="11" fill="#8c98a4">(or once per goal)</text>
  <text x="548" y="248" font-size="12" font-weight="700" fill="#5ef2b8">20 – 50 Hz</text>

  <rect x="36" y="270" width="828" height="38" rx="6" fill="rgba(255,255,255,0.01)"/>
  <text x="48" y="294" font-size="11" fill="#5d6b78">output</text>
  <text x="204" y="294" font-size="12" fill="#c9d1d9">nav_msgs/Path</text>
  <text x="548" y="294" font-size="12" fill="#c9d1d9">geometry_msgs/Twist</text>

  <rect x="36" y="316" width="828" height="38" rx="6" fill="rgba(255,255,255,0.025)"/>
  <text x="48" y="340" font-size="11" fill="#5d6b78">algorithm</text>
  <text x="204" y="340" font-size="12" fill="#c9d1d9">search — A* · Hybrid-A* · Lattice</text>
  <text x="548" y="340" font-size="12" fill="#c9d1d9">optimisation — DWA · MPPI · RPP</text>

  <rect x="36" y="362" width="828" height="38" rx="6" fill="rgba(255,255,255,0.01)"/>
  <text x="48" y="386" font-size="11" fill="#5d6b78">cares about</text>
  <text x="204" y="386" font-size="12" fill="#c9d1d9">completeness · optimality</text>
  <text x="548" y="386" font-size="12" fill="#c9d1d9">dynamics · immediate avoidance</text>

  <path d="M527 68 V 400" stroke="#3a4654" stroke-width="1" stroke-dasharray="3 5" fill="none"/>

  <rect x="36" y="420" width="828" height="56" rx="9" fill="rgba(240,163,107,0.07)" stroke="#f0a36b" stroke-width="1.2"/>
  <text x="52" y="444" font-size="12" font-weight="700" fill="#f3c79b">why they are split, in one line</text>
  <text x="52" y="464" font-size="11.5" fill="#8c98a4">A global search cannot run at 20 Hz, and collision avoidance must — so the two were cut into separate layers.</text>
</svg>
