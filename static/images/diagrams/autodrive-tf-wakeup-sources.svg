<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="노드를 깨우는 발행 주기의 정체. 위쪽에는 tf 토픽의 발행자 세 개가 있다. pinky_bringup이 30헤르츠로 odom에서 base_footprint 변환을 발행하고, robot_state_publisher가 약 30헤르츠로 joint_states를 받을 때마다 바퀴 관절 변환을 재발행하고, amcl이 저빈도로 map에서 odom 변환을 발행해 합계 67헤르츠가 된다. 아래쪽에는 joint_states 실측 50.6헤르츠의 내역이 있는데 bringup의 30헤르츠 외에 URDF 기반 joint_state_publisher가 20.6헤르츠를 중복 발행하고 있었고 이 노드는 엔코더 실측값이 아닌 값을 내므로 제거 대상이다. 제거 후 tf는 55.9헤르츠, joint_states는 30헤르츠로 떨어지고 프로세스 CPU 합계가 19.01퍼센트포인트 감소했다.">
  <rect x="1" y="1" width="898" height="458" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">profile — 무엇이 노드를 깨우는가</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3a4654"/>
    </marker>
  </defs>

  <text x="46" y="70" font-size="12" fill="#6cb6ff">/tf 67.0 Hz — 발행자 3개</text>

  <rect x="46" y="82" width="252" height="64" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="172" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">/pinky_bringup</text>
  <text x="172" y="125" text-anchor="middle" font-size="11.5" fill="#8c98a4">30 Hz · odom → base_footprint</text>
  <text x="172" y="140" text-anchor="middle" font-size="11" fill="#6272a4">bringup.py:88 · 단일 1/30 타이머</text>

  <rect x="324" y="82" width="252" height="64" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="450" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">/robot_state_publisher</text>
  <text x="450" y="125" text-anchor="middle" font-size="11.5" fill="#8c98a4">~30 Hz · base → 바퀴 관절</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#6272a4">joint_states 수신마다 재발행</text>

  <rect x="602" y="82" width="252" height="64" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="728" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">/amcl</text>
  <text x="728" y="125" text-anchor="middle" font-size="11.5" fill="#8c98a4">저빈도 · map → odom</text>
  <text x="728" y="140" text-anchor="middle" font-size="11" fill="#6272a4">측위 갱신 시점에만</text>

  <g stroke="#3a4654" stroke-width="1.6" fill="none">
    <path d="M172 148 V168 H444 V180" marker-end="url(#a3)"/>
    <path d="M450 148 V180" marker-end="url(#a3)"/>
    <path d="M728 148 V168 H456 V180" marker-end="url(#a3)"/>
  </g>

  <rect x="280" y="184" width="340" height="54" rx="9" fill="rgba(94,242,184,0.12)" stroke="#5ef2b8" stroke-width="1.7"/>
  <text x="450" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#b6f2d8">/tf  67.0 Hz</text>
  <text x="450" y="227" text-anchor="middle" font-size="11.5" fill="#9fe6c8">최대 깨어남 유발원</text>

  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#8c98a4">+ /odom 30.1 Hz + /scan 10.1 Hz + 각 노드 타이머(10~20Hz) + lifecycle bond(10Hz)  →  cswch/s 150~190</text>

  <line x1="46" y1="284" x2="854" y2="284" stroke="#243040" stroke-width="1"/>

  <text x="46" y="310" font-size="12" fill="#f0a36b">그런데 /joint_states 실측은 50.6 Hz — bringup은 30 Hz만 내는데?</text>

  <rect x="46" y="322" width="330" height="62" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="211" y="346" text-anchor="middle" font-size="13" font-weight="600" fill="#b9dcff">/pinky_bringup</text>
  <text x="211" y="366" text-anchor="middle" font-size="12" fill="#8c98a4">30.0 Hz · 엔코더 실측값</text>

  <text x="398" y="358" text-anchor="middle" font-size="16" fill="#5d6b78">+</text>

  <rect x="420" y="322" width="434" height="62" rx="8" fill="rgba(240,163,107,0.10)" stroke="#f0a36b" stroke-width="1.5"/>
  <text x="637" y="346" text-anchor="middle" font-size="13" font-weight="600" fill="#f3c79b">★ /joint_state_publisher  20.6 Hz</text>
  <text x="637" y="366" text-anchor="middle" font-size="11.5" fill="#8c98a4">URDF 기반 중복 발행자 · 엔코더 값이 아님 → 제거 대상</text>

  <text x="450" y="414" text-anchor="middle" font-size="12" fill="#5ef2b8">제거 후 — /tf 67.0 → 55.9 Hz · /joint_states 50.6 → 30.0 Hz · 프로세스 CPU 합계 −19.01%p</text>
  <text x="450" y="436" text-anchor="middle" font-size="11.5" fill="#6272a4">과거 타이머 하향 튜닝이 실패한 이유 — 지배항인 /tf 를 건드리지 않았다</text>
</svg>
