<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="The two essentials of AMCL. The top panel shows transform ownership: AMCL publishes map to odom as a drift correction while wheel odometry publishes odom to base_link continuously. Because a frame has exactly one parent, AMCL cannot publish map to base_link directly; that transform is computed automatically as the composition of the two. The bottom panel shows one particle filter cycle: Predict moves particles by the odometry delta, Update weights them by scan likelihood, and Resample redraws them while KLD adapts the particle count.">
  <rect x="1" y="1" width="918" height="448" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="918" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="898" y="28" text-anchor="end" font-size="12" fill="#5d6b78">amcl — TF ownership &amp; filter cycle</text>

  <defs>
    <marker id="am-ah-en" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3a4654"/>
    </marker>
    <marker id="am-ahd-en" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6272a4"/>
    </marker>
  </defs>

  <text x="36" y="80" font-size="12.5" font-weight="700" fill="#e6edf3">① TF ownership — why AMCL publishes map → odom</text>

  <rect x="70" y="110" width="150" height="52" rx="9" fill="rgba(108,182,255,0.10)" stroke="#6cb6ff" stroke-width="1.5"/>
  <text x="145" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#b9dcff">map</text>

  <rect x="390" y="110" width="150" height="52" rx="9" fill="rgba(94,242,184,0.10)" stroke="#5ef2b8" stroke-width="1.5"/>
  <text x="465" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#b6f2d8">odom</text>

  <rect x="700" y="110" width="150" height="52" rx="9" fill="rgba(185,167,230,0.10)" stroke="#b9a7e6" stroke-width="1.5"/>
  <text x="775" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#d6c9f2">base_link</text>

  <g stroke="#3a4654" stroke-width="1.8" fill="none">
    <path d="M220 136 H 384" marker-end="url(#am-ah-en)"/>
    <path d="M540 136 H 694" marker-end="url(#am-ah-en)"/>
  </g>

  <text x="302" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5ef2b8">AMCL</text>
  <text x="302" y="180" text-anchor="middle" font-size="10.5" fill="#8c98a4">drift correction · slow · may jump</text>

  <text x="617" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b9a7e6">wheel odometry</text>
  <text x="617" y="180" text-anchor="middle" font-size="10.5" fill="#8c98a4">continuous · fast · accumulates drift</text>

  <rect x="70" y="196" width="780" height="44" rx="8" fill="rgba(240,163,107,0.07)" stroke="#f0a36b" stroke-width="1.1"/>
  <text x="86" y="215" font-size="11" fill="#f3c79b">A frame has exactly one parent → if AMCL published map → base_link the tree would break.</text>
  <text x="86" y="233" font-size="11" fill="#8c98a4">So it publishes only "how wrong odometry has drifted". map → base_link falls out as the composition of the two.</text>

  <path d="M36 258 H 884" stroke="#3a4654" stroke-width="1" stroke-dasharray="3 5" fill="none"/>

  <text x="36" y="284" font-size="12.5" font-weight="700" fill="#e6edf3">② One particle filter cycle</text>

  <rect x="70" y="300" width="230" height="76" rx="9" fill="rgba(108,182,255,0.07)" stroke="#6cb6ff" stroke-width="1.3"/>
  <text x="86" y="324" font-size="12.5" font-weight="700" fill="#b9dcff">① Predict</text>
  <text x="86" y="345" font-size="10.5" fill="#8c98a4">move particles by the odom delta</text>
  <text x="86" y="364" font-size="10.5" fill="#6272a4">spread them with alpha1–5 noise</text>

  <rect x="345" y="300" width="230" height="76" rx="9" fill="rgba(94,242,184,0.07)" stroke="#5ef2b8" stroke-width="1.3"/>
  <text x="361" y="324" font-size="12.5" font-weight="700" fill="#b6f2d8">② Update</text>
  <text x="361" y="345" font-size="10.5" fill="#8c98a4">"odds this scan comes from here"</text>
  <text x="361" y="364" font-size="10.5" fill="#6272a4">weight via likelihood_field</text>

  <rect x="620" y="300" width="230" height="76" rx="9" fill="rgba(185,167,230,0.07)" stroke="#b9a7e6" stroke-width="1.3"/>
  <text x="636" y="324" font-size="12.5" font-weight="700" fill="#d6c9f2">③ Resample</text>
  <text x="636" y="345" font-size="10.5" fill="#8c98a4">redraw proportional to weight</text>
  <text x="636" y="364" font-size="10.5" fill="#6272a4">KLD adapts the particle count</text>

  <g stroke="#3a4654" stroke-width="1.8" fill="none">
    <path d="M300 338 H 339" marker-end="url(#am-ah-en)"/>
    <path d="M575 338 H 614" marker-end="url(#am-ah-en)"/>
  </g>
  <g stroke="#6272a4" stroke-width="1.3" stroke-dasharray="4 4" fill="none">
    <path d="M735 376 V 396 H 185 V 380" marker-end="url(#am-ahd-en)"/>
  </g>

  <rect x="36" y="410" width="848" height="26" rx="6" fill="rgba(94,242,184,0.05)"/>
  <text x="52" y="427" font-size="11" fill="#8c98a4">Trigger: one cycle per update_min_d (e.g. 0.25 m) or update_min_a (e.g. 0.2 rad) of motion — standing still, nothing updates.</text>
</svg>
