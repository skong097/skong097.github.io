<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" role="img" aria-label="ROS 1과 ROS 2의 통신 구조 비교. ROS 1은 노드가 중앙 roscore 마스터를 거쳐 다른 노드와 통신하므로 중앙 집중 구조이며 마스터가 죽으면 전체가 멈추는 단일 실패점이 된다. ROS 2는 마스터를 없애고 그 자리에 DDS 분산 디스커버리를 넣어 노드끼리 양방향 P2P로 직접 통신한다.">
  <rect x="1" y="1" width="898" height="298" rx="14" fill="#0c1117" stroke="rgba(94,242,184,0.16)"/>
  <rect x="1" y="1" width="898" height="46" rx="14" fill="rgba(255,255,255,0.02)"/>

  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="878" y="28" text-anchor="end" font-size="12" fill="#5d6b78">arch — ROS 1 vs ROS 2 통신 구조</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3a4654"/>
    </marker>
  </defs>

  <!-- ROS 1 row -->
  <text x="46" y="76" font-size="12" fill="#8c98a4">ROS 1</text>

  <rect x="90" y="84" width="150" height="52" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="165" y="115" text-anchor="middle" font-size="13.5" fill="#b9dcff">노드</text>

  <rect x="340" y="84" width="220" height="52" rx="8" fill="rgba(240,163,107,0.10)" stroke="#f0a36b" stroke-width="1.4"/>
  <text x="450" y="107" text-anchor="middle" font-size="13.5" font-weight="600" fill="#f3c79b">roscore</text>
  <text x="450" y="126" text-anchor="middle" font-size="11.5" fill="#8c98a4">중앙 마스터</text>

  <rect x="660" y="84" width="150" height="52" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="735" y="115" text-anchor="middle" font-size="13.5" fill="#b9dcff">노드</text>

  <g stroke="#3a4654" stroke-width="1.6" fill="none">
    <path d="M244 110 H332" marker-end="url(#a1)"/>
    <path d="M564 110 H652" marker-end="url(#a1)"/>
  </g>

  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#f0a36b">중앙 집중 · 마스터가 죽으면 전체 정지 (단일 실패점)</text>

  <line x1="60" y1="176" x2="840" y2="176" stroke="#243040" stroke-width="1"/>

  <!-- ROS 2 row -->
  <text x="46" y="204" font-size="12" fill="#8c98a4">ROS 2</text>

  <rect x="90" y="200" width="150" height="52" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="165" y="231" text-anchor="middle" font-size="13.5" fill="#b9dcff">노드</text>

  <rect x="340" y="200" width="220" height="52" rx="8" fill="rgba(94,242,184,0.12)" stroke="#5ef2b8" stroke-width="1.6"/>
  <text x="450" y="223" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b6f2d8">DDS</text>
  <text x="450" y="242" text-anchor="middle" font-size="11.5" fill="#9fe6c8">분산 디스커버리</text>

  <rect x="660" y="200" width="150" height="52" rx="8" fill="rgba(108,182,255,0.08)" stroke="#6cb6ff" stroke-width="1.2"/>
  <text x="735" y="231" text-anchor="middle" font-size="13.5" fill="#b9dcff">노드</text>

  <g stroke="#3a4654" stroke-width="1.6" fill="none">
    <path d="M244 216 H332" marker-end="url(#a1)"/>
    <path d="M332 238 H244" marker-end="url(#a1)"/>
    <path d="M568 216 H656" marker-end="url(#a1)"/>
    <path d="M656 238 H568" marker-end="url(#a1)"/>
  </g>

  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#5ef2b8">마스터 없음 · 노드끼리 P2P — 그 자리를 산업표준 DDS가 채운다</text>
</svg>
