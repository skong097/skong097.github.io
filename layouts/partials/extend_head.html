{{/*
  layouts/partials/extend_head.html
  DOM 로드 후 JS로 강제 스타일 적용 — CSS 우선순위 문제 완전 해결
*/}}

{{/* 리스트 페이지 터미널 리디자인용 모노스페이스 폰트 */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 제목 정렬은 assets/css/extended/custom.css 의 PAGE HEADERS 섹션에서
  // !important 로 좌측 고정한다. 여기서 JS 로 덮어쓰면 그 CSS 를 이겨버려
  // 정렬을 바꿀 수 없게 되므로 제목 관련 강제 지정은 두지 않는다.

  // Terms (Categories, Tags)
  document.querySelectorAll('.terms-tags').forEach(function(el) {
    el.style.setProperty('justify-content', 'center', 'important');
  });

  // 검색
  var searchbox = document.getElementById('searchbox');
  if (searchbox) searchbox.style.setProperty('text-align', 'center', 'important');

  // breadcrumbs 제거
  document.querySelectorAll('.breadcrumbs').forEach(function(el) {
    el.style.setProperty('display', 'none', 'important');
  });

  // KB Radar: PaperMod 제목 숨김
  if (document.querySelector('.kbr-wrap')) {
    document.querySelectorAll('header.post-header').forEach(function(el) {
      el.style.setProperty('display', 'none', 'important');
    });
  }
});
</script>
