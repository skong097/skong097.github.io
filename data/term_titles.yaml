# term_titles.yaml — 태그/카테고리 term 제목 표기 교정
#
# Hugo 는 term 제목을 자동으로 타이틀케이스로 만든다("ros2" → "Ros2").
# 약어·제품명은 그 규칙이 틀리므로 여기서 표기를 지정한다.
# 키는 urlize 된 term (= /tags/<키>/ 의 디렉터리명), 값은 화면에 쓸 제목.
# 태그와 카테고리가 같은 표를 공유한다.
#
# 새 약어 태그가 생기면 여기 한 줄만 추가하면 된다.
# 사용처: layouts/_default/list.html

